<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Administrativo | Asistencia IA</title>
  <link rel="stylesheet" href="../assets/css/admin-login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body data-login-mode="admin">
  <main class="admin-login-page">
    <div class="admin-top-brand">
      <div class="admin-top-logo"><i class="fa-solid fa-graduation-cap"></i></div>
      <div><strong>ASISTENCIA IA</strong><span>Sistema Inteligente</span></div>
    </div>

    <section class="admin-login-card">
      <div class="admin-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="admin-brand"><strong>ASISTENCIA IA</strong><span>Portal Administrativo</span></div>
      <div class="admin-divider"></div>
      <div class="admin-title"><h1>Iniciar sesión</h1><p>Acceso exclusivo para administradores autorizados.</p></div>

      <div id="loginError" class="admin-login-message"></div>
      <form id="loginForm" class="admin-form">
        <label class="admin-input-group">
          <i class="fa-regular fa-envelope"></i>
          <input id="email" type="email" autocomplete="username" placeholder="Correo del administrador" required />
        </label>
        <label class="admin-input-group">
          <i class="fa-solid fa-lock"></i>
          <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required />
          <button class="admin-password-button" id="togglePassword" type="button" aria-label="Mostrar contraseña"><i class="fa-regular fa-eye-slash"></i></button>
        </label>
        <button id="loginSubmit" class="admin-login-button" type="submit">Iniciar sesión <i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <div style="margin-top: 14px; text-align: center;">
        <button type="button" onclick="document.getElementById('email').value='admin@asistencia.local';document.getElementById('password').value='admin123';document.getElementById('loginSubmit').click();" style="background:#eaf3ff;color:#1673ff;border:1px solid #1673ff;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;">
          <i class="fa-solid fa-user-shield"></i> Demo Administrador
        </button>
      </div>
      <a href="portal_login.html" class="back-academic"><i class="fa-solid fa-arrow-left"></i> Volver al Portal Académico</a>
    </section>
  </main>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
