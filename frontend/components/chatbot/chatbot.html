<!-- =====================================================
     ASISTENTE IA - COMPONENTE GLOBAL
===================================================== -->

<!-- Fondo cuando el panel está abierto -->
<div
    class="chat-overlay"
    id="chatOverlay"
></div>


<!-- =====================================================
     BOTÓN FLOTANTE
===================================================== -->

<button
    class="chat-floating-button"
    id="chatFloatingButton"
    type="button"
    aria-label="Abrir Asistente IA"
>

    <i class="fa-solid fa-robot"></i>

    <span
        class="chat-floating-notification"
        id="chatNotification"
    >
        1
    </span>

</button>


<!-- =====================================================
     PANEL DEL CHATBOT
===================================================== -->

<aside
    class="chat-panel"
    id="chatPanel"
>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="chat-header">

        <div class="chat-header-left">

            <div class="chat-header-avatar">

                <i class="fa-solid fa-robot"></i>

            </div>


            <div class="chat-header-text">

                <strong>
                    Asistente IA
                </strong>

                <span id="chatRoleLabel">
                    Campus Virtual
                </span>

            </div>

        </div>


        <div class="chat-header-actions">

            <!-- Ampliar -->
            <button
                class="chat-header-button"
                id="expandChatButton"
                type="button"
                aria-label="Ampliar chat"
            >

                <i class="fa-solid fa-expand"></i>

            </button>


            <!-- Nueva conversación -->
            <button
                class="chat-header-button"
                id="newChatButton"
                type="button"
                aria-label="Nueva conversación"
            >

                <i class="fa-solid fa-plus"></i>

            </button>


            <!-- Cerrar -->
            <button
                class="chat-header-button"
                id="closeChatButton"
                type="button"
                aria-label="Cerrar chat"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

    </header>



    <!-- =================================================
         CONTENIDO
    ================================================== -->

    <div class="chat-body">


        <!-- =============================================
             BIENVENIDA
        ============================================== -->

        <section
            class="chat-welcome"
            id="chatWelcome"
        >

            <div class="chat-welcome-icon">

                <i class="fa-solid fa-robot"></i>

            </div>


            <h2 id="chatGreeting">
                Hola
            </h2>


            <p>
                ¿En qué puedo ayudarte?
            </p>


            <!-- Sugerencias -->
            <div
                class="chat-suggestions"
                id="chatSuggestions"
            >

                <!-- Se llenará desde chatbot.js -->

            </div>

        </section>



        <!-- =============================================
             MENSAJES
        ============================================== -->

        <section
            class="chat-messages"
            id="chatMessages"
        >

            <!--
                Aquí aparecerán:
                - mensajes del usuario
                - respuestas del chatbot
            -->

        </section>

    </div>



    <!-- =================================================
         INPUT
    ================================================== -->

    <footer class="chat-footer">

        <div class="chat-input-container">

            <textarea
                id="chatInput"
                rows="1"
                placeholder="Escribe tu pregunta..."
                maxlength="1000"
            ></textarea>

            <button
                class="chat-mic-button"
                id="chatMicButton"
                type="button"
                aria-label="Hablar con el asistente"
            >
                <i class="fa-solid fa-microphone"></i>
            </button>

            <button
                class="chat-send-button"
                id="chatSendButton"
                type="button"
                aria-label="Enviar mensaje"
            >

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>


        <div class="chat-footer-info">

            <i class="fa-solid fa-shield-halved"></i>

            <span id="chatPermissionText">
                El asistente responde según los permisos de tu cuenta.
            </span>

        </div>

    </footer>


</aside>
