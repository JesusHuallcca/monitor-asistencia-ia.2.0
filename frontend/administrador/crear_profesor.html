<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta de profesor | Asistencia IA</title><link rel="stylesheet" href="../assets/css/user-create.css"></head><body data-create-role="PROFESOR"><main class="page"><div class="top"><strong>ASISTENCIA IA</strong><a href="dashboard.html">← Volver</a></div><section class="card"><h1>Crear cuenta de profesor</h1><p class="sub">Completa los datos institucionales. La cuenta quedará habilitada para iniciar sesión.</p><form id="createUserForm"><div class="grid"><div class="field"><label>Nombres</label><input name="nombres" required></div><div class="field"><label>Apellidos</label><input name="apellidos" required></div><div class="field"><label>Correo institucional</label><input name="email" type="email" required></div><div class="field"><label>Contraseña temporal</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>Código</label><input name="codigo" required></div><div class="field"><label>Especialidad</label><input name="detalle" required></div></div><button type="submit">Crear cuenta</button><div id="formMessage" class="form-message"></div></form></section></main><script src="../assets/js/api.js"></script><script src="../assets/js/auth.js"></script><script src="../assets/js/user-create.js"></script></body></html>
